<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Policy Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f7;--panel:#ffffff;--ink:#17222d;--muted:#5d6b78;--line:#d9e0e6;
  --accent:#1f5f8b;--accent-ink:#ffffff;--mark:#ffe08a;--user:#e3eef6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f161d;--panel:#18222c;--ink:#e6edf3;--muted:#98a6b3;--line:#2b3947;--accent:#6fb3e0;--accent-ink:#0b1620;--mark:#6b5a1c;--user:#1f3447;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f161d;--panel:#18222c;--ink:#e6edf3;--muted:#98a6b3;--line:#2b3947;--accent:#6fb3e0;--accent-ink:#0b1620;--mark:#6b5a1c;--user:#1f3447;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Public Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;overflow-y:auto}
h1{font:600 24px/1.2 "Newsreader",Georgia,serif;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
h2{font:600 14px/1.3 "Public Sans",sans-serif;margin:18px 0 8px}
.pol{border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.pol summary{cursor:pointer;padding:9px 11px;font-weight:500}
.pol div{padding:0 11px 10px;font-size:13px;color:var(--muted)}
.pol b{color:var(--ink);font-weight:600}
.pol button{margin-top:6px}
main{display:flex;flex-direction:column;min-width:0;height:100%}
#log{flex:1;overflow-y:auto;padding:24px clamp(14px,5vw,56px)}
.msg{max-width:680px;margin:0 0 16px}
.msg.user{margin-left:auto;background:var(--user);padding:9px 13px;border-radius:10px 10px 2px 10px}
.msg.bot{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 15px;border-radius:2px 10px 10px 10px}
.src{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.src b{color:var(--accent);font-weight:600}
.msg mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.more{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;cursor:pointer}
.chip,.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.ghost{border-radius:6px;padding:3px 9px;font-size:12px}
.chip:hover,.ghost:hover{border-color:var(--accent)}
form{display:flex;gap:8px;padding:12px clamp(14px,5vw,56px) 16px;border-top:1px solid var(--line);background:var(--panel)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;width:100%}
form input{flex:1}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:0 18px;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{min-height:110px;resize:vertical;margin:6px 0}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:34vh}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Smart Policy Assistant</h1>
    <p class="sub">Ask a question and get the matching clause from your policy library.</p>
    <h2>Policy library</h2>
    <div id="policies"></div>
    <h2>Add a policy</h2>
    <input id="newTitle" placeholder="Policy title">
    <textarea id="newBody" placeholder="Separate sections with a blank line. Start each section with a heading, then a colon, e.g. Notice period: Give 30 days’ notice."></textarea>
    <button class="ghost" id="addBtn" type="button">Add policy</button>
    <button class="ghost" id="resetBtn" type="button">Restore samples</button>
  </aside>
  <main>
    <div id="log" aria-live="polite"></div>
    <form id="askForm">
      <input id="q" autocomplete="off" placeholder="Ask about leave, expenses, remote work…" aria-label="Your question">
      <button class="go" type="submit">Ask</button>
    </form>
  </main>
</div>

<script>
const SAMPLE = [
  {title:"Leave Policy", sections:[
    {h:"Annual leave", t:"Full-time employees receive 24 days of paid annual leave each year. Up to 5 unused days can be carried over to the next year."},
    {h:"Sick leave", t:"Employees get 10 days of paid sick leave per year. A medical certificate is required for absences longer than 2 consecutive days."},
    {h:"Parental leave", t:"Primary caregivers receive 16 weeks of paid parental leave. Secondary caregivers receive 4 weeks. Leave must begin within 6 months of the birth or adoption."},
    {h:"Requesting leave", t:"Submit leave requests in the HR portal at least 14 days in advance. Your manager will approve or decline within 3 working days."}]},
  {title:"Remote Work Policy", sections:[
    {h:"Eligibility", t:"Employees who have completed their 3-month probation may work remotely up to 3 days per week with manager approval."},
    {h:"Core hours", t:"Remote staff must be available online between 10:00 and 16:00 local time on working days."},
    {h:"Equipment", t:"The company provides a laptop and monitor. A one-time home office allowance of 500 is available for a desk or chair."}]},
  {title:"Expense Policy", sections:[
    {h:"Travel expenses", t:"Book economy flights and standard hotel rooms through the approved travel portal. Daily meal allowance during travel is 40."},
    {h:"Claim deadline", t:"Submit expense claims within 30 days of the purchase with original receipts attached. Late claims may be rejected."},
    {h:"Approval limits", t:"Managers approve claims up to 500. Claims above 500 need department head approval."}]},
  {title:"Code of Conduct", sections:[
    {h:"Respect at work", t:"Harassment, discrimination and bullying are not tolerated. Report concerns to HR or through the anonymous ethics hotline."},
    {h:"Gifts and conflicts", t:"Do not accept gifts worth more than 50 from vendors. Declare any conflict of interest to your manager in writing."},
    {h:"Data protection", t:"Keep customer data on approved systems only. Report suspected data breaches to the security team within 24 hours."}]}
];
const STOP = new Set("a an the is are was were be to of for in on at by and or my i me do does can how what when where who which many much get it this that with from about our we you your there any have has".split(" "));
const SYN = {vacation:"leave",holiday:"leave",pto:"leave",wfh:"remote",home:"remote",maternity:"parental",paternity:"parental",baby:"parental",ill:"sick",illness:"sick",reimburse:"expense",reimbursement:"expense",claim:"expense",flight:"travel",hotel:"travel",harass:"harassment",bribe:"gifts",gift:"gifts"};
let policies = [], docs = [];

function tokens(s){
  return (s.toLowerCase().match(/[a-z0-9]+/g)||[]).map(w=>{
    w = SYN[w]||w;
    if(w.length>4) w = w.replace(/(ing|ed|es|s)$/,"");
    return w;
  }).filter(w=>!STOP.has(w));
}
function load(){
  try{ const s = localStorage.getItem("spa-policies"); if(s) return JSON.parse(s); }catch(e){}
  return JSON.parse(JSON.stringify(SAMPLE));
}
function save(){ try{ localStorage.setItem("spa-policies", JSON.stringify(policies)); }catch(e){} }

function build(){
  docs = [];
  policies.forEach(p=>p.sections.forEach(s=>{
    docs.push({p:p.title, h:s.h, t:s.t, head:tokens(p.title+" "+s.h), body:tokens(s.t)});
  }));
  const df = {};
  docs.forEach(d=>new Set([...d.head,...d.body]).forEach(w=>df[w]=(df[w]||0)+1));
  docs.forEach(d=>d.idf = w => Math.log(1+docs.length/(df[w]||1)));
}
function search(q){
  const qt = [...new Set(tokens(q))];
  if(!qt.length) return [];
  return docs.map(d=>{
    let score = 0;
    qt.forEach(w=>{
      const idf = d.idf(w);
      if(d.head.includes(w)) score += 2.5*idf;
      if(d.body.includes(w)) score += idf;
    });
    return {d, score, qt};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);
}

const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function highlight(text, qt){
  return esc(text).replace(/[A-Za-z0-9]+/g, w=> qt.includes(tokens(w)[0]) ? "<mark>"+w+"</mark>" : w);
}
const log = document.getElementById("log");
function add(cls, html){
  const el = document.createElement("div");
  el.className = "msg "+cls; el.innerHTML = html;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}
function answer(q){
  const res = search(q);
  if(!res.length || res[0].score < 1){
    add("bot","I couldn’t find a policy that covers that. Try different keywords, or add the missing policy from the panel on the left.");
    return;
  }
  const top = res[0], rest = res.slice(1,3);
  let html = `<div class="src"><b>${esc(top.d.p)}</b> · ${esc(top.d.h)}</div>${highlight(top.d.t, top.qt)}`;
  if(rest.length){
    html += `<div class="more">Also see: ` + rest.map(r=>`${esc(r.d.p)} (${esc(r.d.h)})`).join("; ") + `</div>`;
  }
  add("bot", html);
}
function ask(q){
  q = q.trim(); if(!q) return;
  add("user", esc(q)); answer(q);
}

function renderPolicies(){
  const box = document.getElementById("policies");
  box.innerHTML = "";
  policies.forEach((p,i)=>{
    const d = document.createElement("details"); d.className = "pol";
    d.innerHTML = `<summary>${esc(p.title)}</summary><div>`+
      p.sections.map(s=>`<p><b>${esc(s.h)}.</b> ${esc(s.t)}</p>`).join("")+
      `<button class="ghost" data-i="${i}" type="button">Remove policy</button></div>`;
    box.appendChild(d);
  });
  box.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{
    policies.splice(+b.dataset.i,1); save(); build(); renderPolicies();
  });
}

document.getElementById("askForm").onsubmit = e=>{
  e.preventDefault();
  const i = document.getElementById("q"); ask(i.value); i.value = "";
};
document.getElementById("addBtn").onclick = ()=>{
  const title = document.getElementById("newTitle").value.trim();
  const body = document.getElementById("newBody").value.trim();
  if(!title || !body){ add("bot","Enter a title and at least one section to add a policy."); return; }
  const sections = body.split(/\n\s*\n/).map(b=>{
    const m = b.match(/^([^:\n]{2,40}):\s*([\s\S]+)$/);
    return m ? {h:m[1].trim(), t:m[2].trim()} : {h:"General", t:b.trim()};
  });
  policies.push({title, sections}); save(); build(); renderPolicies();
  document.getElementById("newTitle").value = ""; document.getElementById("newBody").value = "";
  add("bot", `Added <b>${esc(title)}</b> with ${sections.length} section${sections.length>1?"s":""}. You can ask about it now.`);
};
document.getElementById("resetBtn").onclick = ()=>{
  policies = JSON.parse(JSON.stringify(SAMPLE)); save(); build(); renderPolicies();
  add("bot","Sample policies restored.");
};

policies = load(); build(); renderPolicies();
const hello = add("bot","Hello. I answer questions from the policy library. Try one of these:");
const chips = document.createElement("div"); chips.className = "chips";
["How many sick days do I get?","Can I work from home?","What is the expense claim deadline?","How long is parental leave?"].forEach(t=>{
  const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = t;
  b.onclick = ()=>ask(t); chips.appendChild(b);
});
hello.appendChild(chips);
</script>
</body>
</html>
